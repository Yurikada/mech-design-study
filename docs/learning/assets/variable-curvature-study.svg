<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title id="title">曲率が変わる検証問題</title>
<desc id="desc">左端を固定し、部材内部の上半分へ左向き、下半分へ右向きの体積力を与える。右端と上下辺の表面力はゼロ。選んだ変位から応力と荷重を導き、メッシュ細分化による場の誤差を調べる。</desc>
<!-- Fixed light sheet for offline viewing, GitHub and print. Geometry and arrows schematic. -->
<rect width="640" height="440" fill="#fafaf7"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#165f86"/></marker></defs>
<g font-family="Segoe UI,Yu Gothic,sans-serif" fill="#182933">
<text x="24" y="34" font-size="22" font-weight="700">曲率が変わる解から、荷重を作る</text>
<text x="24" y="61" font-size="15">体積力の検証ケース。形状と矢印は模式図。</text>
<rect x="115" y="102" width="400" height="110" fill="#e6f0f6" stroke="#182933"/>
<path d="M115 92 V222 M103 102 L115 114 M103 132 L115 144 M103 162 L115 174 M103 192 L115 204" stroke="#182933" fill="none"/>
<path d="M115 157 H515" stroke="#6a7b85" stroke-dasharray="5 5"/>
<g stroke="#165f86" stroke-width="2" marker-end="url(#arrow)">
<path d="M185 127 H145"/><path d="M275 127 H235"/><path d="M365 127 H325"/><path d="M455 127 H415"/>
<path d="M145 187 H185"/><path d="M235 187 H275"/><path d="M325 187 H365"/><path d="M415 187 H455"/>
</g>
<text x="24" y="247" font-size="15">左端 u=v=0</text>
<text x="225" y="247" font-size="15">右端・上下辺：表面力0</text>
<text x="145" y="91" font-size="15">内部全体へ体積力 b_x=−M₀y/(IL) [N/m³]</text>
<text x="132" y="278" font-size="16">κ(x)=κ₀(1−x/L)　　根元で最大、先端で0</text>
<g stroke="#b8c8d1" fill="#ffffff"><rect x="24" y="308" width="175" height="74" rx="6"/><rect x="232" y="308" width="175" height="74" rx="6"/><rect x="440" y="308" width="175" height="74" rx="6"/></g>
<g text-anchor="middle" font-size="16"><text x="111" y="338">三次の変位を選ぶ</text><text x="111" y="365">参照解を固定</text><text x="319" y="338">応力と荷重を導く</text><text x="319" y="365">釣合い・境界を確認</text><text x="527" y="338">細分化して比較</text><text x="527" y="365">場の誤差を測る</text></g>
<g stroke="#165f86" stroke-width="2" marker-end="url(#arrow)"><path d="M202 345 H228"/><path d="M410 345 H436"/></g>
<text x="24" y="417" font-size="15">計算結果の図ではなく、次の数値実験の設定と検証手順。</text>
</g></svg>
