<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">計算の検証と実機への妥当性確認</title>
<desc id="desc">式と実装の一致は計算を正しく実装したかの検証。計算と実験の比較は、目的と条件を定めた上で実機を表すかを確認する。互いの代わりにはならない。</desc>
<rect width="640" height="340" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#1f2937"/></marker></defs>
<g font-family="Arial, Yu Gothic, sans-serif" font-size="24" fill="#1f2937">
<text x="30" y="37" font-weight="700">式を正しく計算したか</text>
<rect x="30" y="57" width="220" height="58" rx="8" fill="#d7e8f4"/><text x="52" y="94">式・既知の解</text>
<rect x="390" y="57" width="220" height="58" rx="8" fill="#d7e8f4"/><text x="409" y="94">実装の結果</text>
<path d="M261 88H379" stroke="#1f2937" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="274" y="140">照合</text>
<text x="30" y="193" font-weight="700">目的・条件の範囲で実機を表すか</text>
<rect x="30" y="213" width="220" height="58" rx="8" fill="#f7ecdc"/><text x="52" y="250">計算の予測</text>
<rect x="390" y="213" width="220" height="58" rx="8" fill="#f7ecdc"/><text x="409" y="250">実験・測定</text>
<path d="M261 244H379" stroke="#1f2937" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="274" y="296">照合</text>
<text x="30" y="329">測定誤差・支持条件・使用範囲も含める</text>
</g></svg>
