[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mech-design-study"
version = "0.1.0"
description = "Learning mechanical design disciplines and multidisciplinary constraint integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.3", "scipy==1.16.2"]

[project.scripts]
mech-study = "mech_design.cli:main"

[project.optional-dependencies]
figures = ["matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
