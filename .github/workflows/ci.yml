name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/build_lecture_data.py --check
      - run: python scripts/build_lecture_qa.py --check
      - run: python scripts/build_mms_results.py --check
      - run: python -m mech_design cases/heated_cantilever.toml --json
      - run: python -m mech_design compare cases/heated_cantilever_comparison.toml --output outputs/comparison.json --json
      - run: python -m mech_design compare --replay outputs/comparison.json --json
      - run: python -m mech_design fem cases/cantilever_fem.toml --output outputs/fem.json
      - run: python -m mech_design fem --replay outputs/fem.json
      - run: python -m mech_design plane cases/plane_bending.toml --output outputs/plane.json
      - run: python -m mech_design plane --replay outputs/plane.json
      - run: python -m mech_design mms cases/plane_mms.toml --output outputs/mms.json
      - run: python -m mech_design mms --replay outputs/mms.json
